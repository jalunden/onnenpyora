<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#160b26"><title>Kohtalonpyörä</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nosifer&display=swap');
:root{font-family:Fredoka,system-ui,sans-serif;color:#fff5df;background:#140b24}*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 46%,#4b245f 0%,#211333 55%,#0d091b 100%)}body:before{content:'✦  ✧       ✦       ✧      ✦';position:fixed;inset:0;pointer-events:none;opacity:.18;font-size:40px;letter-spacing:6vw;animation:float 11s ease-in-out infinite alternate}body:after{content:'';position:fixed;bottom:0;left:0;right:0;height:24vh;background:linear-gradient(transparent,#10091d);pointer-events:none}.app{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 12px 24px;gap:8px}.eyebrow{color:#e6b7ff;font-size:clamp(11px,2vw,17px);letter-spacing:.27em;font-weight:700}.heading{font-family:Nosifer,Georgia,serif;text-align:center;font-size:clamp(29px,6.4vw,72px);line-height:1.5;margin:0;color:#ffb53d;text-shadow:0 5px 0 #7b2d36,0 0 32px #f46625;user-select:none;-webkit-user-select:none;touch-action:manipulation}.subtitle{text-align:center;color:#d4b7e2;font-size:clamp(13px,2vw,19px)}.wheel-wrap{width:min(82vw,65svh,640px);aspect-ratio:1;position:relative;filter:drop-shadow(0 15px 30px #0009);margin:6px auto}.wheel-wrap:before{content:'';position:absolute;inset:-12px;border-radius:50%;background:repeating-conic-gradient(#ffd77b 0 7deg,#74335d 7deg 14deg);box-shadow:0 0 0 5px #401d50,0 0 35px #f9a12a66}.wheel{width:100%;height:100%;position:relative;border-radius:50%;overflow:hidden;border:8px solid #27112e;transform:rotate(0deg);will-change:transform}.wheel svg{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:5;top:-26px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:21px solid transparent;border-right:21px solid transparent;border-top:51px solid #ffe3a1;filter:drop-shadow(0 3px 2px #190b26)}.spin{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border:5px solid #ffe0a2;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffdd74,#f48124 60%,#9e3b30);box-shadow:0 5px 0 #682d37,0 0 25px #ffa83a;display:grid;place-content:center;gap:0;color:#2c1335;font:700 clamp(10px,1.8vw,16px) Fredoka,sans-serif;cursor:pointer;touch-action:manipulation}.spin span:first-child{font-size:clamp(20px,4vw,37px)}.spin:disabled{opacity:.85;cursor:wait}.legend,.footer{display:none}.hint{text-align:center;color:#e9d6ff;font-size:clamp(13px,2.1vw,19px);margin-top:10px}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:7px}.legend span{background:#ffffff12;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:clamp(12px,1.6vw,16px)}.overlay{position:fixed;z-index:20;inset:0;background:#090514d9;display:grid;place-items:center;padding:20px;backdrop-filter:blur(9px)}[hidden]{display:none!important}.result{width:min(94vw,500px);text-align:center;border:3px solid #fbc36a;background:radial-gradient(circle at top,#60356c,#1e1232 75%);border-radius:28px;padding:24px;box-shadow:0 0 75px #f3a44155;animation:pop .45s ease-out}.result-icon{font-size:clamp(75px,17vw,130px);filter:drop-shadow(0 0 20px #ffc36b)}.result h2{font-size:clamp(27px,6vw,44px);margin:6px 0;color:#ffd37e}.result p{font-size:clamp(18px,4vw,28px)}button{font-family:inherit}.action{border:0;background:#ffb13f;color:#32152c;font-size:20px;font-weight:700;padding:14px 26px;border-radius:15px;cursor:pointer}.settings{width:min(94vw,460px);max-height:90svh;overflow:auto;background:#271633;border:2px solid #b980c9;border-radius:22px;padding:22px;box-shadow:0 20px 80px #000b}.settings h2{margin:0 0 14px}.settings label{display:block;margin:14px 0 6px}.settings select,.settings input[type=range]{width:100%}.settings select{padding:11px;background:#3c2551;color:white;border:1px solid #9e72af;border-radius:9px;font-size:16px}.settings input[type=checkbox]{width:19px;height:19px;vertical-align:middle}.settings small{color:#c5aecf}.settings .action{margin-top:20px;width:100%}.settings .close{float:right;background:none;color:white;border:0;font-size:27px;cursor:pointer}.footer{color:#bfa3cb;font-size:12px;text-align:center}body[data-theme=classic]{background:radial-gradient(ellipse at center,#174b6c,#0c1837 75%)}body[data-theme=classic] .heading{font-family:Fredoka,sans-serif;color:#ffda63;text-shadow:0 4px 0 #153a5b}body[data-theme=christmas]{background:radial-gradient(ellipse at center,#24564a,#092b2b 75%)}body[data-theme=christmas] .heading{font-family:Fredoka,sans-serif;color:#ffefc6;text-shadow:0 4px 0 #b43848}@keyframes float{to{transform:translateY(-35px)}}@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@media(max-height:700px){.app{justify-content:flex-start}.heading{font-size:clamp(25px,5vw,48px)}.wheel-wrap{width:min(76vw,55svh,500px)}.legend{margin-top:0}}
</style></head><body data-theme="halloween"><main class="app"><div class="eyebrow">✦ USKALLATKO KOKEILLA ONNEASI? ✦</div><h1 class="heading" id="title">KOHTALONPYÖRÄ</h1><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div class="wheel" id="wheel"><svg viewBox="0 0 600 600" id="wheelSvg" role="img" aria-label="Onnenpyörä, jossa on kaksitoista palkintosektoria"></svg></div><button class="spin" id="spin" aria-label="Pyöräytä onnenpyörää"><span>✦</span><span>PYÖRÄYTÄ</span></button></div><div class="hint" id="hint">Kosketa pyörän keskustaa!</div></main><div class="overlay" id="winOverlay" hidden><div class="result" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="result-icon" id="winIcon"></div><h2 id="winTitle">KOHTALO ON PUHUNUT!</h2><p id="winName"></p><button class="action" id="again">JATKA ✦</button></div></div><div class="overlay" id="settingsOverlay" hidden><div class="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><button class="close" id="closeSettings" aria-label="Sulje">×</button><h2 id="settingsTitle">⚙️ Ylläpito</h2><small>Avaa tämä näkymä painamalla otsikkoa 5 sekuntia.</small><label for="theme">Teema</label><select id="theme"><option value="halloween">🎃 Halloween</option><option value="christmas">🎄 Joulu</option><option value="classic">🎡 Klassinen</option></select><label for="duration">Pyörähdyksen kesto: <output id="durationOut">7</output> sekuntia</label><input id="duration" type="range" min="4" max="12" value="7"><label><input id="sound" type="checkbox" checked> Äänitehosteet</label><label><input id="effects" type="checkbox" checked> Voittoanimaatio</label><button class="action" id="saveSettings">TALLENNA</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const wheel=$('wheel'),svg=$('wheelSvg'),spin=$('spin');const entries=['skull','pumpkin','ghost','skull','pumpkin','ghost','skull','pumpkin','wild','ghost','skull','pumpkin'];const prizes={skull:{icon:'💀',name:'PÄÄKALLO',color:'#7439b5'},pumpkin:{icon:'🎃',name:'KURPITSA',color:'#e87a20'},ghost:{icon:'👻',name:'AAVE',color:'#188e9c'},wild:{icon:'⭐',name:'VAPAAVALINTAINEN!',color:'#d3a333'}};const palettes={halloween:['#7439b5','#e87a20','#188e9c','#d3a333'],christmas:['#b8394e','#187b58','#3979a9','#d3a333'],classic:['#6555c8','#e9803d','#158cbb','#d3a333']};let settings={theme:'halloween',duration:7,sound:true,effects:true};try{settings={...settings,...JSON.parse(localStorage.getItem('kohtalonpyora.settings')||'{}')}}catch{}let rotation=0,busy=false,ctx=null;const ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}function draw(){svg.replaceChildren();const palette=palettes[settings.theme]||palettes.halloween;entries.forEach((key,i)=>{const a=-Math.PI/2+(i-.5)*Math.PI/6,b=a+Math.PI/6;const x1=300+294*Math.cos(a),y1=300+294*Math.sin(a),x2=300+294*Math.cos(b),y2=300+294*Math.sin(b);const c=key==='skull'?0:key==='pumpkin'?1:key==='ghost'?2:3;svg.append(el('path',{d:`M300 300 L${x1} ${y1} A294 294 0 0 1 ${x2} ${y2} Z`,fill:palette[c],stroke:'#2a1239','stroke-width':4}));const mid=(a+b)/2,r=207;const t=el('text',{x:300+r*Math.cos(mid),y:300+r*Math.sin(mid)+15,'text-anchor':'middle','font-size':key==='wild'?52:62,style:'paint-order:stroke;stroke:#29152b;stroke-width:2px'} ,prizes[key].icon);svg.append(t);});for(let i=0;i<24;i++){const a=i*Math.PI/12;svg.append(el('circle',{cx:300+286*Math.cos(a),cy:300+286*Math.sin(a),r:4.4,fill:i%2?'#ffe0a4':'#fff5d1'}))}}function apply(){document.body.dataset.theme=settings.theme;$('title').textContent=settings.theme==='halloween'?'KOHTALONPYÖRÄ':settings.theme==='christmas'?'JOULUN ONNENPYÖRÄ':'ONNENPYÖRÄ';$('theme').value=settings.theme;$('duration').value=settings.duration;$('durationOut').value=settings.duration;$('sound').checked=settings.sound;$('effects').checked=settings.effects;draw()}function audio(){if(!settings.sound)return null;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch{return null}}function beep(freq=650,len=.035,volume=.045){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(volume,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+len);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+len)}function fanfare(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,.25,.12),i*130))}function rand(max){const x=new Uint32Array(1);crypto.getRandomValues(x);return Math.floor(x[0]/4294967296*max)}function start(){if(busy)return;busy=true;spin.disabled=true;$('hint').textContent='Kohtalo pyörii…';audio();const index=rand(entries.length),duration=settings.duration*1000,from=rotation;const targetMod=(360-index*30)%360;const current=((from%360)+360)%360;const offset=(targetMod-current+360)%360;const to=from+360*(5+rand(4))+offset;const t0=performance.now();let lastTick=-1;function frame(now){const p=Math.min(1,(now-t0)/duration),e=1-Math.pow(1-p,4),angle=from+(to-from)*e;wheel.style.transform=`rotate(${angle}deg)`;const tick=Math.floor(angle/30);if(tick!==lastTick){if(lastTick!==-1)beep(440+Math.round(p*280),.025,.025);lastTick=tick}if(p<1){requestAnimationFrame(frame)}else{rotation=to%360;wheel.style.transform=`rotate(${rotation}deg)`;busy=false;spin.disabled=false;$('hint').textContent='Kosketa pyörän keskustaa!';const prize=prizes[entries[index]];$('winIcon').textContent=prize.icon;$('winName').textContent=entries[index]==='wild'?'Saat valita palkinnon mistä tahansa laatikosta!':`Lunasta palkintosi ${prize.icon} ${prize.name} -laatikosta!`;$('winTitle').textContent=entries[index]==='wild'?'ONNENPOTKU!':'KOHTALO ON PUHUNUT!';$('winOverlay').hidden=false; if(settings.effects)fanfare();else beep(784,.22,.1)}}requestAnimationFrame(frame)}spin.addEventListener('click',start);$('again').addEventListener('click',()=>{$('winOverlay').hidden=true});$('winOverlay').addEventListener('click',e=>{if(e.target===$('winOverlay'))$('winOverlay').hidden=true});let timer;const title=$('title');function holdStart(e){if(busy)return;timer=setTimeout(()=>{$('settingsOverlay').hidden=false;beep(600,.12)},5000)}function holdEnd(){clearTimeout(timer)}title.addEventListener('pointerdown',holdStart);['pointerup','pointerleave','pointercancel'].forEach(n=>title.addEventListener(n,holdEnd));title.addEventListener('contextmenu',e=>e.preventDefault());$('duration').addEventListener('input',e=>$('durationOut').value=e.target.value);$('closeSettings').addEventListener('click',()=>{$('settingsOverlay').hidden=true});$('saveSettings').addEventListener('click',()=>{settings={theme:$('theme').value,duration:Number($('duration').value),sound:$('sound').checked,effects:$('effects').checked};try{localStorage.setItem('kohtalonpyora.settings',JSON.stringify(settings))}catch{}apply();$('settingsOverlay').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('winOverlay').hidden=true;$('settingsOverlay').hidden=true}});apply()})();
</script></body></html>
